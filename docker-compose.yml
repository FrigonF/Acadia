version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: acadia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acadia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-acadia_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acadia_backend
    restart: always
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be provided}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?HMAC_SECRET_KEY must be provided}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be provided}
      ED25519_PRIVATE_KEY_HEX: ${ED25519_PRIVATE_KEY_HEX:?ED25519_PRIVATE_KEY_HEX must be provided}
      KEY_ID: ${KEY_ID:-acadia-platform-v1}
      TRUSTED_PUBLIC_KEYS: ${TRUSTED_PUBLIC_KEYS:-{}}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
